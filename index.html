    const el = (id) => document.getElementById(id);

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function chips(items, className = "chip-list") {
      return `<div class="${className}">${items.map((item) => `<span class="${className === "pill-list" ? "pill" : "chip"}">${escapeHtml(item)}</span>`).join("")}</div>`;
    }

    function renderNav(items, target) {
      target.innerHTML = items.map((item) => `<a href="#${item.id}">${escapeHtml(item.label)}</a>`).join("");
    }

    function renderHero(hero) {
      el("heroKicker").textContent = hero.kicker;
      el("heroTitle").innerHTML = hero.titleHtml;

      el("heroActions").innerHTML = `
        <a class="btn-primary" href="#contact">${escapeHtml(hero.primary)}</a>
        <a class="btn-secondary" href="#solution">${escapeHtml(hero.secondary)}</a>

          <strong>${escapeHtml(item.value)}</strong>
          <span>${escapeHtml(item.label)}</span>
        </li>

      el("heroStrip").innerHTML = hero.strip.map((item) => `<li class="mini-chip">${escapeHtml(item)}</li>`).join("");

      el("matrixKicker").textContent = matrix.kicker;
      el("matrixTitle").textContent = matrix.title;
      el("matrixLead").textContent = matrix.lead;
      el("matrixHead").innerHTML = matrix.headers.map((header) => `<th>${escapeHtml(header)}</th>`).join("");
      el("matrixBody").innerHTML = matrix.rows.map((row) => `<tr>${row.map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("");
      el("matrixNote").innerHTML = `
        <strong class="compare-tag">${escapeHtml(matrix.noteTag)}</strong>
        <p>${escapeHtml(matrix.note)}</p>
      `;
    }

    function renderPlatforms(platforms) {
      el("platformsKicker").textContent = platforms.kicker;
      el("platformsTitle").textContent = platforms.title;
      el("platformsLead").textContent = platforms.lead;
      el("platformGrid").innerHTML = platforms.cards.map((card) => `
        <article class="platform-card">
          <span class="platform-tag">${escapeHtml(card.index)}</span>
          <h3>${escapeHtml(card.title)}</h3>
          <p>${escapeHtml(card.copy)}</p>
        </article>
      `).join("");
      el("platformsNote").textContent = platforms.note;
    }

    function renderPath(path) {
      el("pathKicker").textContent = path.kicker;
      el("pathTitle").textContent = path.title;
      el("pathLead").textContent = path.lead;
      el("pathGrid").innerHTML = path.steps.map((step) => `
        <article class="timeline-card">
          <span class="timeline-tag">${escapeHtml(step.index)}</span>
          <h3>${escapeHtml(step.title)}</h3>
          <p>${escapeHtml(step.copy)}</p>
        </article>
      `).join("");
      el("pathNote").innerHTML = `
        <strong>${escapeHtml(path.quoteTag)}</strong>
        <p>${escapeHtml(path.quote)}</p>
      `;
    }

    function renderCapability(capability) {
      el("capabilityKicker").textContent = capability.kicker;
      el("capabilityTitle").textContent = capability.title;
      el("capabilityLead").textContent = capability.lead;
      el("capabilityGrid").innerHTML = capability.cards.map((card) => `
        <article class="capability-card">
          <span class="capability-tag">${escapeHtml(card.index)}</span>
          <h3>${escapeHtml(card.title)}</h3>
          <p>${escapeHtml(card.copy)}</p>
        </article>
      `).join("");
    }

    function renderCompliance(compliance) {
      el("complianceKicker").textContent = compliance.kicker;
      el("complianceTitle").textContent = compliance.title;
      el("complianceLead").textContent = compliance.lead;
      el("complianceAvoid").innerHTML = `
        <span class="section-num">${escapeHtml(compliance.avoidTitle)}</span>
        <h3>${escapeHtml(state.lang === "zh" ? "我们不做" : "We do not")}</h3>
        <ul class="check-list warning-list">${compliance.avoid.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
      `;
      el("complianceDo").innerHTML = `
        <span class="section-num">${escapeHtml(compliance.doTitle)}</span>
        <h3>${escapeHtml(state.lang === "zh" ? "我们做的是" : "We do")}</h3>
        <ul class="check-list">${compliance.do.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
      `;
      el("complianceNote").textContent = compliance.note;
    }

    function renderScenarios(scenarios) {
      el("scenariosKicker").textContent = scenarios.kicker;
      el("scenariosTitle").textContent = scenarios.title;
      el("scenariosLead").textContent = scenarios.lead;
      el("scenarioGrid").innerHTML = scenarios.cards.map((card) => `
        <article class="scenario-card">
          <span class="scenario-tag">${escapeHtml(card.index)}</span>
          <h3>${escapeHtml(card.title)}</h3>
          <p class="scenario-copy">${escapeHtml(card.copy)}</p>
          ${chips(card.tags, "pill-list")}
        </article>
      `).join("");
    }

    function renderTiming(timing) {
      el("timingKicker").textContent = timing.kicker;
      el("timingTitle").textContent = timing.title;
      el("timingLead").textContent = timing.lead;
      el("timingGrid").innerHTML = timing.points.map((point) => `
        <article class="timeline-card">
          <span class="timeline-tag">${escapeHtml(point.index)}</span>
          <strong>${escapeHtml(point.title)}</strong>
          <p>${escapeHtml(point.copy)}</p>
        </article>
      `).join("");
      el("timingQuote").innerHTML = `
        <strong>${escapeHtml(timing.quoteTag)}</strong>
        <p>${escapeHtml(timing.quote)}</p>
      `;
    }

    function renderContact(contact) {
      el("contactKicker").textContent = contact.kicker;
      el("contactTitle").textContent = contact.title;
      el("contactLead").textContent = contact.lead;
      el("contactPanel").innerHTML = `
        <span class="section-num">${escapeHtml(contact.checklistTitle)}</span>
        <h3 style="margin-top:16px;font-size:clamp(28px,3.6vw,48px);line-height:1.04;letter-spacing:-0.05em;">${escapeHtml(state.lang === "zh" ? "预约一次企业矩阵诊断" : "Book a matrix diagnosis")}</h3>
        <ul class="check-list" style="margin-top:18px;">${contact.checklist.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
        <div class="hero-actions" style="margin-top:22px;">
          <a class="btn-primary" href="#wechatQr">${escapeHtml(contact.primary)}</a>
          <a class="btn-secondary" href="#matrix">${escapeHtml(contact.secondary)}</a>
        </div>
        <div class="summary-line" style="margin-top:20px;">
          <strong style="display:block;color:var(--accent-strong);font-family:var(--mono);letter-spacing:0.12em;font-size:12px;text-transform:uppercase;">${escapeHtml(contact.closingTag)}</strong>
          <p style="margin-top:10px;color:var(--text);">${escapeHtml(contact.closing)}</p>
        </div>
      `;
      el("qrTitle").textContent = contact.qrTitle;
      el("qrCopy").textContent = contact.qrCopy;
    }

    function renderFooter(footer) {
      el("footerBrand").textContent = footer.brand;
      el("footerTag").textContent = footer.tag;
      el("footerCopy").textContent = footer.copy;
      el("footerCopyright").textContent = footer.copyright;
      renderNav(CONTENT[state.lang].nav, el("footerLinks"));
    }

    function setMeta(selector, value) {
      const node = document.querySelector(selector);
      if (node) {
        node.setAttribute("content", value);
      }
    }

    function applyTheme() {
      document.body.dataset.theme = state.theme;
      localStorage.setItem("kaaaai_theme", state.theme);
      el("themeToggle").textContent = state.theme === "dark" ? "◐" : "◑";
      el("themeToggle").setAttribute("aria-label", state.lang === "zh" ? (state.theme === "dark" ? "切换到浅色模式" : "切换到深色模式") : (state.theme === "dark" ? "Switch to light mode" : "Switch to dark mode"));
    }

    function applyLanguage() {
      const c = CONTENT[state.lang];
      document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
      document.title = c.meta.title;
      setMeta('meta[name="description"]', c.meta.description);
      setMeta('meta[property="og:title"]', c.meta.title);
      setMeta('meta[property="og:description"]', c.meta.description);
      setMeta('meta[name="twitter:title"]', c.meta.title);
      setMeta('meta[name="twitter:description"]', c.meta.description);

      renderNav(c.nav, el("mainNav"));
      renderHero(c.hero);
      renderPain(c.pain);
      renderSolution(c.solution);
      renderNumbers(c.numbers);
      renderSources(c.sources);
      renderMatrix(c.matrix);
      renderPlatforms(c.platforms);
      renderPath(c.path);
      renderCapability(c.capability);
      renderCompliance(c.compliance);
      renderScenarios(c.scenarios);
      renderTiming(c.timing);
      renderContact(c.contact);
      renderFooter(c.footer);

      el("brandTag").textContent = c.footer.tag;
      el("headerCta").textContent = state.lang === "zh" ? "免费诊断" : "Free diagnosis";
      el("langToggle").textContent = state.lang === "zh" ? "EN" : "中";
      el("footerCopyright").textContent = c.footer.copyright;
      localStorage.setItem("kaaaai_lang", state.lang);
      applyTheme();
    }

    function setMobileMenu(open) {
      const siteHeader = el("siteHeader");
      const toggle = el("mobileMenuToggle");
      siteHeader.classList.toggle("is-menu-open", open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      toggle.setAttribute("aria-label", state.lang === "zh" ? (open ? "关闭导航菜单" : "打开导航菜单") : (open ? "Close navigation menu" : "Open navigation menu"));
    }

    el("themeToggle").addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
    });

    el("langToggle").addEventListener("click", () => {
      state.lang = state.lang === "zh" ? "en" : "zh";
      applyLanguage();
      setMobileMenu(false);
    });

    el("mobileMenuToggle").addEventListener("click", (event) => {
      event.stopPropagation();
      setMobileMenu(!el("siteHeader").classList.contains("is-menu-open"));
    });

    el("mainNav").addEventListener("click", (event) => {
      if (event.target.tagName === "A") {
        setMobileMenu(false);
      }
    });

    document.addEventListener("click", (event) => {
      if (window.matchMedia("(max-width: 920px)").matches && !el("siteHeader").contains(event.target)) {
        setMobileMenu(false);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        setMobileMenu(false);
      }
    });

    window.addEventListener("resize", () => {
      if (!window.matchMedia("(max-width: 920px)").matches) {
        setMobileMenu(false);
      }
    });

    const backToTop = el("backToTop");
    const updateBackToTop = () => {
      backToTop.classList.toggle("is-visible", window.scrollY > 700);
    };

    window.addEventListener("scroll", updateBackToTop, { passive: true });
    backToTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    applyLanguage();
    updateBackToTop();
  </script>
</body>
</html>
